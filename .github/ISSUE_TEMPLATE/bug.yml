name: Bug report
description: Report a reproducible problem
body:
  - type: input
    id: version
    attributes:
      label: Stage CMS and PHP versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use synthetic content. Never include credentials or private exports.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
